<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>note見出し画像タイプ診断</title>
  <style>
    :root { --text:#222; --muted:#666; --line:#e6e2dc; --soft:#f8f6f1; --accent:#2f6f73; --accent-dark:#24575a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#fff; color:var(--text); line-height:1.8; }
    header { max-width:900px; margin:0 auto; padding:40px 20px 18px; }
    header a { color:var(--muted); font-size:13px; text-decoration:none; }
    h1 { margin:18px 0 8px; font-size:clamp(24px,5vw,40px); font-weight:600; letter-spacing:0; line-height:1.35; }
    .lead { margin:0; color:var(--muted); font-size:15px; }
    main { max-width:900px; margin:0 auto 56px; padding:0 20px; }
    .progress { height:8px; background:var(--soft); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:20px 0 24px; }
    .progress span { display:block; height:100%; width:0; background:var(--accent); transition:width .2s ease; }
    .question { border-top:1px solid var(--line); padding:24px 0 8px; }
    .question h2 { margin:0 0 16px; font-size:clamp(19px,4vw,26px); line-height:1.45; font-weight:600; }
    .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .choice { width:100%; min-height:74px; padding:14px 16px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); text-align:left; font:inherit; cursor:pointer; }
    .choice:hover, .choice.is-selected { border-color:var(--accent); background:#eef7f6; }
    .nav { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:22px; }
    button.action, a.action { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 18px; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
    button.secondary, a.secondary { background:#fff; color:var(--accent-dark); border-color:var(--line); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .result { display:none; border-top:1px solid var(--line); padding-top:26px; }
    .result.is-visible { display:block; }
    .result-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,340px); gap:24px; align-items:start; }
    .result h2 { margin:0 0 10px; font-size:clamp(24px,5vw,36px); line-height:1.35; }
    .result p { margin:0 0 14px; color:var(--muted); }
    .result img { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
    .recommend { margin:20px 0; padding:16px; background:var(--soft); border:1px solid var(--line); border-radius:8px; }
    .recommend strong { display:block; margin-bottom:8px; }
    .links { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .small-note { font-size:13px; color:var(--muted); margin-top:18px; }
    @media (max-width:720px) { .result-layout { grid-template-columns:1fr; } .nav { align-items:stretch; flex-direction:column-reverse; } button.action, a.action { width:100%; } }
  </style>
</head>
<body>
<header>
  <a href="index.html">← 画像まとめへ戻る</a>
  <h1>note見出し画像タイプ診断</h1>
  <p class="lead">質問に答えると、今の記事に合いやすい見出し画像タイプが分かります。</p>
</header>
<main>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <section id="quiz" class="question" aria-live="polite">
    <h2 id="questionText"></h2>
    <div id="choices" class="choices"></div>
    <div class="nav">
      <button id="backButton" class="action secondary" type="button">戻る</button>
      <button id="nextButton" class="action" type="button" disabled>次へ</button>
    </div>
  </section>
  <section id="result" class="result" aria-live="polite">
    <div class="result-layout">
      <div>
        <h2 id="resultTitle"></h2>
        <p id="resultLead"></p>
        <div class="recommend"><strong>おすすめの使い方</strong><div id="resultUsage"></div></div>
        <div class="links">
          <a id="resultLink" class="action" href="#">おすすめ画像まとめを見る</a>
          <button id="restartButton" class="action secondary" type="button">もう一度診断する</button>
        </div>
        <p class="small-note">迷ったときは、余白が多く、文字を入れやすい画像を選ぶと使いやすいです。</p>
      </div>
      <img id="resultImage" src="" alt="">
    </div>
  </section>
</main>
<script>
const results={soft:{title:"やさしい光タイプ",lead:"静かな日記、エッセイ、気持ちを整える記事に合いやすいタイプです。強く主張しすぎず、文章の空気をやわらかく見せてくれます。",usage:"導入文、日記、エッセイ、気づきの記事に向いています。白い余白がある画像を選ぶと、タイトルも入れやすくなります。",image:"images/soft-light-minimal.png",alt:"やさしい光のミニマル画像",url:"https://note.com/cheeky_guppy1145/n/n43ff57420b43"},white:{title:"白背景シンプルタイプ",lead:"どんなテーマにも合わせやすい万能タイプです。記事の内容を邪魔せず、すっきり見せたいときに使いやすいです。",usage:"解説記事、まとめ記事、日記、エッセイなど幅広く使えます。迷ったらこのタイプを選ぶと安定します。",image:"images/white-background-paper.png",alt:"白背景のシンプル画像",url:"https://note.com/cheeky_guppy1145/n/nae53046ba088"},landscape:{title:"余白のある風景タイプ",lead:"落ち着いた印象を出したい記事に向いています。広い空や静かな風景は、読み手に入り口の余裕を作ってくれます。",usage:"振り返り、考え方、暮らし、旅、長めの記事の導入に合います。余白多めの風景を選ぶと文字も載せやすいです。",image:"images/calm-landscape-space.png",alt:"落ち着いた風景の余白多め画像",url:"https://note.com/cheeky_guppy1145/n/n76175843f254"},japan:{title:"和風・日本的タイプ",lead:"日本らしさ、落ち着き、暮らしの静けさを出したい記事に合うタイプです。やさしい伝統感を足したいときに使いやすいです。",usage:"日本文化、和風の暮らし、静かな作業風景、国内向け情報の記事に向いています。文字や有名モチーフが少ない画像が使いやすいです。",image:"images/japanese-traditional-simple-v2.png",alt:"日本の和風・伝統シンプル画像",url:"https://note.com/cheeky_guppy1145/n/nebccf519d72b"},city:{title:"街並み・外の空気タイプ",lead:"生活感、外出、地域、日常の場面を伝えたい記事に向いています。記事に具体的な場の空気を足せます。",usage:"旅行前の情報、街歩き、買い物、店舗、日常の記録に合います。昼なら明るく、夜なら雰囲気重視で選ぶと使いやすいです。",image:"images/japanese-streetscape-day.png",alt:"日本の街並み昼のシンプル画像",url:"https://note.com/cheeky_guppy1145/n/nedcd02899f78"},cafe:{title:"カフェ・暮らしの小物タイプ",lead:"コーヒー、食べ物、作業時間、ひと息つく雰囲気の記事に合いやすいタイプです。親しみやすさを出したいときに便利です。",usage:"カフェ、食べ物、休憩、作業、暮らしの小さな楽しみの記事に向いています。器や小物がシンプルな画像を選ぶと読みやすくなります。",image:"images/japanese-cafe-coffee-simple.png",alt:"日本のカフェ・コーヒーのシンプル画像",url:"https://note.com/cheeky_guppy1145/n/n6b8237e49c0a"}};
const questions=[{text:"記事の雰囲気に近いものは？",choices:[{label:"やさしい・静か",scores:{soft:3,white:1}},{label:"すっきり・実用的",scores:{white:3,city:1}},{label:"落ち着いた・考えごと",scores:{landscape:3,soft:1}},{label:"日常感・親しみ",scores:{cafe:2,city:2}}]},{text:"見出し画像で一番大事にしたいことは？",choices:[{label:"文字を入れやすい余白",scores:{white:2,landscape:2}},{label:"記事の空気をやわらかくする",scores:{soft:3,cafe:1}},{label:"日本らしさを出す",scores:{japan:4}},{label:"場面が伝わること",scores:{city:3,cafe:1}}]},{text:"記事のテーマに近いものは？",choices:[{label:"考え方・気づき・エッセイ",scores:{soft:2,landscape:2}},{label:"まとめ・解説・ノウハウ",scores:{white:3,soft:1}},{label:"日本・和風・伝統",scores:{japan:4}},{label:"街・店・外出・生活",scores:{city:3,cafe:1}}]},{text:"色味はどれが合いそうですか？",choices:[{label:"白・淡い色",scores:{white:2,soft:2}},{label:"青空・自然色",scores:{landscape:3,city:1}},{label:"和紙・畳・藍色",scores:{japan:4}},{label:"ベージュ・茶色・コーヒー色",scores:{cafe:3,japan:1}}]},{text:"読者にどんな印象を残したいですか？",choices:[{label:"安心して読めそう",scores:{soft:2,white:2}},{label:"使いやすく整理されていそう",scores:{white:3}},{label:"ゆっくり読みたくなる",scores:{landscape:2,cafe:2}},{label:"具体的な場所や暮らしが浮かぶ",scores:{city:3,japan:1}}]}];
let current=0;const answers=[];const quiz=document.getElementById("quiz");const result=document.getElementById("result");const questionText=document.getElementById("questionText");const choicesEl=document.getElementById("choices");const backButton=document.getElementById("backButton");const nextButton=document.getElementById("nextButton");const progressBar=document.getElementById("progressBar");
function renderQuestion(){const q=questions[current];questionText.textContent=q.text;choicesEl.innerHTML="";q.choices.forEach((choice,index)=>{const button=document.createElement("button");button.className="choice"+(answers[current]===index?" is-selected":"");button.type="button";button.textContent=choice.label;button.addEventListener("click",()=>{answers[current]=index;nextButton.disabled=false;renderQuestion();});choicesEl.appendChild(button);});backButton.disabled=current===0;nextButton.disabled=answers[current]===undefined;nextButton.textContent=current===questions.length-1?"結果を見る":"次へ";progressBar.style.width=`${(current/questions.length)*100}%`;}
function calculateResult(){const scores=Object.fromEntries(Object.keys(results).map(key=>[key,0]));answers.forEach((answerIndex,questionIndex)=>{const choice=questions[questionIndex].choices[answerIndex];Object.entries(choice.scores).forEach(([key,value])=>{scores[key]+=value;});});return Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];}
function showResult(){const data=results[calculateResult()];document.getElementById("resultTitle").textContent=data.title;document.getElementById("resultLead").textContent=data.lead;document.getElementById("resultUsage").textContent=data.usage;document.getElementById("resultImage").src=data.image;document.getElementById("resultImage").alt=data.alt;document.getElementById("resultLink").href=data.url;quiz.style.display="none";result.classList.add("is-visible");progressBar.style.width="100%";window.scrollTo({top:0,behavior:"smooth"});}
nextButton.addEventListener("click",()=>{if(answers[current]===undefined)return;if(current===questions.length-1){showResult();return;}current+=1;renderQuestion();});
backButton.addEventListener("click",()=>{if(current===0)return;current-=1;renderQuestion();});
document.getElementById("restartButton").addEventListener("click",()=>{current=0;answers.length=0;result.classList.remove("is-visible");quiz.style.display="block";renderQuestion();window.scrollTo({top:0,behavior:"smooth"});});
renderQuestion();
</script>
</body>
</html>
