<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog Header Image Quiz</title><meta name="description" content="Answer a few questions and find the best simple blog header image style for your article."><link rel="canonical" href="https://seigotanaka123-creator.github.io/note-tools/en/note-image-diagnosis.html"><link rel="alternate" hreflang="ja" href="https://seigotanaka123-creator.github.io/note-tools/note-image-diagnosis.html"><link rel="alternate" hreflang="en" href="https://seigotanaka123-creator.github.io/note-tools/en/note-image-diagnosis.html"><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;line-height:1.8}header,main{max-width:900px;margin:0 auto;padding:32px 20px}a{color:#2f6f73}.choice{display:block;width:100%;margin:10px 0;padding:14px;border:1px solid #ddd;border-radius:8px;background:#fff;text-align:left;font:inherit;cursor:pointer}.choice:hover,.choice.on{background:#eef7f6;border-color:#2f6f73}.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:10px 18px;border-radius:8px;border:1px solid #2f6f73;background:#2f6f73;color:white;text-decoration:none;font-weight:600;cursor:pointer}.secondary{background:white;color:#2f6f73;border-color:#ddd}.result{display:none;border-top:1px solid #ddd;margin-top:24px;padding-top:24px}.result.show{display:block}img{max-width:340px;width:100%;border-radius:8px;border:1px solid #ddd}</style></head><body><header><a href="index.html">← Back to home</a> / <a href="../note-image-diagnosis.html">日本語</a><h1>Blog Header Image Quiz</h1><p>Find a simple cover image style that fits your article.</p></header><main><h2 id="q"></h2><div id="choices"></div><button id="next" class="btn" disabled>Next</button><section id="result" class="result"><h2 id="rt"></h2><p id="rl"></p><p id="ru"></p><img id="ri" src="" alt=""><p><a id="link" class="btn" href="#">View Recommended Images</a> <button id="restart" class="btn secondary">Restart</button></p><p style="font-size:13px;color:#666;margin-top:12px;">The recommended note article is currently in Japanese. You can use your browser's translation feature to read it.</p></section></main><script>const results={soft:{title:'Soft Light Type',lead:'Best for essays, quiet diaries, and gentle reflections.',usage:'Use images with soft light and plenty of white space.',image:'../images/soft-light-minimal.png',url:'https://note.com/cheeky_guppy1145/n/n43ff57420b43'},white:{title:'Simple White Background Type',lead:'A versatile choice for many kinds of articles.',usage:'Use when you want a clean, readable, neutral header.',image:'../images/white-background-paper.png',url:'https://note.com/cheeky_guppy1145/n/nae53046ba088'},landscape:{title:'Calm Landscape Type',lead:'Good for thoughtful posts and calm introductions.',usage:'Use wide skies and open landscapes with negative space.',image:'../images/calm-landscape-space.png',url:'https://note.com/cheeky_guppy1145/n/n76175843f254'},japan:{title:'Japanese Minimal Type',lead:'Good for Japanese culture, calm living, and traditional moods.',usage:'Choose simple images without readable text or landmarks.',image:'../images/japanese-traditional-simple-v2.png',url:'https://note.com/cheeky_guppy1145/n/nebccf519d72b'},city:{title:'Streetscape Type',lead:'Good for daily life, shops, travel, and local scenes.',usage:'Use simple streetscapes that clearly show the setting.',image:'../images/japanese-streetscape-day.png',url:'https://note.com/cheeky_guppy1145/n/nedcd02899f78'},cafe:{title:'Cafe and Lifestyle Type',lead:'Good for coffee, food, breaks, and work time.',usage:'Use simple objects and calm table scenes.',image:'../images/japanese-cafe-coffee-simple.png',url:'https://note.com/cheeky_guppy1145/n/n6b8237e49c0a'}};const qs=[{t:'What mood fits your article?',c:[['Gentle and quiet',{soft:3,white:1}],['Clean and practical',{white:3}],['Thoughtful and calm',{landscape:3}],['Warm and familiar',{cafe:2,city:2}]]},{t:'What matters most?',c:[['Space for text',{white:2,landscape:2}],['A softer mood',{soft:3}],['Japanese atmosphere',{japan:4}],['A clear scene',{city:3,cafe:1}]]},{t:'What is your topic?',c:[['Essay or reflection',{soft:2,landscape:2}],['How-to or summary',{white:3}],['Japan or tradition',{japan:4}],['City, shop, or daily life',{city:3,cafe:1}]]}];let i=0,a=[];function draw(){q.textContent=qs[i].t;choices.innerHTML='';qs[i].c.forEach((x,n)=>{let b=document.createElement('button');b.className='choice'+(a[i]===n?' on':'');b.textContent=x[0];b.onclick=()=>{a[i]=n;next.disabled=false;draw()};choices.appendChild(b)});next.textContent=i===qs.length-1?'Show result':'Next';next.disabled=a[i]===undefined}function calc(){let s={soft:0,white:0,landscape:0,japan:0,city:0,cafe:0};a.forEach((v,k)=>Object.entries(qs[k].c[v][1]).forEach(([x,y])=>s[x]+=y));return Object.entries(s).sort((x,y)=>y[1]-x[1])[0][0]}next.onclick=()=>{if(i===qs.length-1){let r=results[calc()];rt.textContent=r.title;rl.textContent=r.lead;ru.textContent=r.usage;ri.src=r.image;link.href=r.url;result.classList.add('show');return}i++;draw()};restart.onclick=()=>{i=0;a=[];result.classList.remove('show');draw()};draw();</script></body></html>
